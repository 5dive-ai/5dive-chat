name: Sideload APK
run-name: Build sideloadable debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, dive-3648-mobile-latest]
    paths:
      - mobile/**
      - .github/workflows/sideload-apk.yml

concurrency:
  group: sideload-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Prime Flutter SDK
        run: flutter --version
      - name: Install dependencies
        run: cd mobile && flutter pub get
      - name: Build Android debug APK
        run: just mobile-build-android
      - name: Show APK output
        run: ls -la mobile/build/app/outputs/flutter-apk/
      - name: Name the APK for the phone
        run: |
          set -euo pipefail
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk 5dive-${{ github.run_number }}.apk
          ls -la 5dive-*.apk
      - name: Upload APK (CI artifact, needs a GitHub login to fetch)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fivedive-debug-apk
          path: 5dive-*.apk
          if-no-files-found: error
      # A CI artifact link is useless on a phone (it 302s to a login). Publish the
      # same bytes as a prerelease asset so the download is anonymous.
      - name: Publish as a prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mobile-sideload-5dive-${{ github.run_number }}"
          gh release create "$tag" "5dive-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "5dive mobile (sideload debug) - $tag" \
            --notes "Debug APK of the 5dive-branded mobile app. Android only. applicationId com.fivedive.app - installs alongside any existing Buzz app."
          gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].url'
      # DIVE-3648: the per-version release above is history; a blog post or a QR code
      # needs ONE url that never goes stale. Rolling tag `mobile-latest`, asset name
      # always `5dive.apk`, same pattern as sprig-latest in this repo. It stays
      # prerelease=true on purpose so /releases/latest keeps resolving to the CLI.
      - name: Update the rolling mobile-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="mobile-latest"
          title="5dive mobile (sideload debug, rolling)"
          notes="Rolling debug APK of the 5dive-branded mobile app — this tag always carries the newest cut, under the stable asset name \`5dive.apk\`.

          Permanent download: https://github.com/${REPO}/releases/download/${tag}/5dive.apk

          Android only. applicationId \`com.fivedive.app\`, so it installs alongside any existing Buzz app. Same bytes as \`mobile-sideload-5dive-${RUN}\` (\`${SHA}\`), which is kept as the versioned history."

          cp "5dive-${RUN}.apk" 5dive.apk

          # `gh release edit` exits 1 with "release not found" the first time, and a
          # fork inherits no releases — so create-then-edit. On every later cut the
          # tag is force-moved to the sha we just built, the release is reused, and
          # the asset is clobbered in place so the download URL never changes.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${tag}" -f sha="$SHA" -F force=true >/dev/null
            gh release edit "$tag" --repo "$REPO" --prerelease --title "$title" --notes "$notes"
          else
            gh release create "$tag" --repo "$REPO" --target "$SHA" --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload "$tag" 5dive.apk --repo "$REPO" --clobber

          gh release view "$tag" --repo "$REPO" --json isPrerelease,tagName,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
      # The whole point of the rolling tag is a link that works on a phone with no
      # GitHub login. Assert that, rather than assuming the upload implies it.
      - name: Assert the permanent URL resolves anonymously
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/${REPO}/releases/download/mobile-latest/5dive.apk"
          for attempt in 1 2 3 4 5; do
            read -r code type < <(curl -sIL --max-time 60 -o /dev/null \
              -w '%{http_code} %{content_type}\n' "$url")
            echo "attempt ${attempt}: ${code} ${type:-<none>} ${url}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::${url} never returned 200 anonymously (last: ${code})"
          exit 1
